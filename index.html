<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>TGM SceneX Admin Login</title>

  <!-- Tailwind via CDN (utilities for this page) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0f0f0f] text-white">
  <main class="min-h-screen">
    <section class="relative w-full min-h-screen">
      <div class="absolute inset-0">
        <img
          src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=80"
          alt="Cinematic branding background"
          class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-black/70" aria-hidden="true"></div>
      </div>

      <!-- Content shell: 2 columns, stacks on mobile -->
      <div class="relative z-10 min-h-screen flex">
        <div class="hidden lg:block lg:w-1/2">
          <div class="h-full flex items-center px-10">
            <div class="max-w-xl">
              <div class="inline-flex items-center gap-2 rounded-2xl border border-white/15 bg-white/5 px-4 py-2">
                <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-purple-500 to-cyan-400"></span>
                <span class="text-sm font-semibold text-white/90">TGM SceneX</span>
              </div>

              <h1 class="mt-6 text-4xl md:text-5xl font-extrabold leading-tight tracking-tight">
                TGM SceneX -
                <span class="bg-gradient-to-r from-purple-400 via-cyan-300 to-amber-300 bg-clip-text text-transparent">
                  Talent Discovery Platform
                </span>
              </h1>

              <p class="mt-4 text-white/75 text-base md:text-lg">
                Premium media control panel for moderation &amp; algorithm calibration.
              </p>

              <div class="mt-8 grid gap-3">
                <div class="rounded-3xl border border-white/10 bg-black/20 backdrop-blur p-4">
                  <div class="text-sm text-white/70">Signal</div>
                  <div class="font-bold text-lg">Realtime moderation</div>
                </div>
                <div class="rounded-3xl border border-white/10 bg-black/20 backdrop-blur p-4">
                  <div class="text-sm text-white/70">Calibration</div>
                  <div class="font-bold text-lg">Weights &amp; visibility tiers</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="w-full lg:w-1/2 flex items-center justify-center p-5 sm:p-8">
          <div class="w-full max-w-md">
            <div class="rounded-3xl border border-white/15 bg-white/5 backdrop-blur-xl p-6 sm:p-8 shadow-2xl">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <h2 class="text-2xl font-bold">Admin Login</h2>
                  <p class="text-white/70 text-sm mt-1">Sign in to manage SceneX systems.</p>
                </div>
                <div class="hidden sm:flex w-10 h-10 items-center justify-center rounded-2xl bg-gradient-to-r from-purple-500/30 to-cyan-400/20 border border-white/15">
                  <span class="text-lg font-black">SX</span>
                </div>
              </div>

              <form class="mt-6" onsubmit="event.preventDefault();">
                <div class="mb-4">
                  <label for="loginEmail" class="block text-sm font-semibold text-white/75 mb-2">Email</label>
                  <input
                    id="loginEmail"
                    name="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="admin@scenex.com"
                    class="w-full rounded-2xl border border-white/15 bg-black/20 px-4 py-3 outline-none focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/20"
                    required
                  />
                </div>

                <div class="mb-5">
                  <label for="loginPassword" class="block text-sm font-semibold text-white/75 mb-2">Password</label>
                  <input
                    id="loginPassword"
                    name="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    class="w-full rounded-2xl border border-white/15 bg-black/20 px-4 py-3 outline-none focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/20"
                    required
                  />
                </div>

                <button
                  type="button"
                  class="w-full rounded-2xl bg-gradient-to-r from-purple-600 via-cyan-500 to-amber-400 text-black font-extrabold px-4 py-3 shadow-lg shadow-purple-500/15 hover:brightness-110 transition focus:outline-none focus:ring-4 focus:ring-purple-500/30"
                >
                  Admin Login
                </button>

                <div class="mt-4 text-center text-xs text-white/60">
                  Demo UI only — connect authentication in your JS layer.
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- styles.css kept for existing app styling (safe) -->
  <link href="./styles.css" rel="stylesheet" />

  <!-- Firebase Compat (standard scripts; avoids module/CSP issues) -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

  <script>
    // Configuration
    window.SCENEX_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCv6STR4C0atEG9OLZvoYb_61HNrnS2dG0",
      authDomain: "scenex-66e0a.firebaseapp.com",
      projectId: "scenex-66e0a",
      storageBucket: "scenex-66e0a.firebasestorage.app",
      messagingSenderId: "987826703702",
      appId: "1:987826703702:web:0f7bba806af1c26b9b9af7"
    };

    // Initialize
    firebase.initializeApp(window.SCENEX_FIREBASE_CONFIG);
  </script>



  <script src="./app.js" defer></script>
</body>
</html>
